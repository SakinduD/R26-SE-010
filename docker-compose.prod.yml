services:
  web:
    image: ${WEB_IMAGE}
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: always

  api:
    image: ${API_IMAGE}
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcloud-tts-key.json
    depends_on:
      db:
        condition: service_healthy
    restart: always
    volumes:
      # Mount Google Cloud TTS credentials key
      - ./gcloud-tts-key.json:/app/gcloud-tts-key.json:ro
      # Mount the heavy models from the VPS directly into the container paths
      - ./models/feedback_analytics:/training/feedback_analytics/models
      - ./models/affect_fusion:/app/app/models/affect_fusion

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:
